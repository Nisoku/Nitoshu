<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitoshu</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="open-button" type="button">Open File</button>
      <button id="save-button" type="button">Save File</button>
      <button id="zen-button" type="button" title="Toggle zen mode">
        Zen
      </button>

      <div class="filename-container">
        <input
          type="text"
          id="filename-input"
          value="Untitled.txt"
          spellcheck="false"
          title="Rename file here"
        />
      </div>

      <button
        id="search-button"
        type="button"
        title="Find and replace (Ctrl+F)"
        aria-label="Find and replace"
      ></button>

      <select id="language-select" title="Syntax highlighting">
        <option value="">Auto</option>
      </select>

      <button
        id="settings-button"
        type="button"
        title="Settings"
        aria-label="Settings"
      >
        Settings
      </button>
    </div>

    <div id="tab-bar">
      <div id="tabs"></div>
      <button
        id="new-tab-button"
        type="button"
        title="New file"
        aria-label="New file"
      ></button>
    </div>

    <input type="file" id="file-input" />

    <div id="editor-container">
      <div id="editor"></div>
    </div>

    <div id="status-bar">
      <span id="char-count">0 characters</span>
      <span>
        <b>Nitoshu</b>
      </span>
      <span id="save-status">Ready</span>
    </div>

    <div id="settings-panel" hidden>
      <div class="settings-header">
        <h2>Settings</h2>
        <button
          id="settings-close"
          type="button"
          aria-label="Close settings"
        ></button>
      </div>
      <label class="settings-row">
        <span>Theme</span>
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="settings-row">
        <span>Indent</span>
        <select id="indent-select">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tabs</option>
        </select>
      </label>
      <label class="settings-row">
        <span>Word wrap</span>
        <input type="checkbox" id="word-wrap-toggle" />
      </label>
      <div class="settings-section">
        <h3>Recent files</h3>
        <div id="recent-list" class="recent-list"></div>
      </div>
    </div>

    <button
      id="zen-exit-button"
      type="button"
      title="Exit zen mode (Esc)"
      aria-label="Exit zen mode"
    ></button>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
